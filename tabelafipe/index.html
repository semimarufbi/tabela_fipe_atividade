<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta Tabela FIPE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>🚗 Consulta Tabela FIPE</h1>
    <p id="status"></p>

    <h2>Consulta por marca e modelo</h2>

    <label for="tabela">Tabela de referência (tabelas/v1):</label>
    <select id="tabela">
      <option value="">Mais recente</option>
    </select>

    <label for="tipo">Tipo de veículo:</label>
    <select id="tipo">
      <option value="carros">Carros</option>
      <option value="motos">Motos</option>
      <option value="caminhoes">Caminhões</option>
    </select>

    <label for="marca">Marca (marcas/v1):</label>
    <select id="marca" disabled></select>

    <label for="modelo">Modelo (veiculos/v1):</label>
    <select id="modelo" disabled></select>

    <label for="ano">Ano (anos/v1):</label>
    <select id="ano" disabled></select>

    <button id="btnDetalhes" disabled>Consultar preço</button>

    <h2>Consulta por código FIPE</h2>
    <label for="codigo">Código FIPE:</label>
    <input id="codigo" placeholder="001004-9">
    <button id="btnCodigo">Consultar</button>

    <h2>Resultado</h2>
    <div id="resultado">Nenhuma consulta realizada ainda.</div>
  </div>

  <script src="script.js"></script>
</body>

</html>
